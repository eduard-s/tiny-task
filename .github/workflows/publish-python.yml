name: Publish Python

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Match tag and package version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('The tag must match the package version.')
          PY
      - name: Install tools
        run: python -m pip install -e '.[dev]'
      - name: Examine source and run tests
        run: |
          ruff check .
          ruff format --check .
          mypy src/tiny_task
          pytest --cov=tiny_task --cov-report=term-missing
          tiny-task demo --output artifacts/demo
      - name: Make and examine distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/examine_distribution.py
      - name: Install the wheel in a new environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m tiny_task --version
          .venv-wheel/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tiny-task-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
