name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_neural:
        description: Run the optional public-data neural benchmark
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Examine source
        run: |
          ruff check .
          ruff format --check .
      - name: Examine types
        if: matrix.python-version == '3.12'
        run: mypy src/tiny_task
      - name: Run tests
        run: pytest --cov=tiny_task --cov-report=term-missing --cov-report=xml
      - name: Run the offline demo
        run: tiny-task demo --output artifacts/demo
      - name: Make distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/examine_distribution.py
      - name: Install the wheel in a new environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m tiny_task --version
          .venv-wheel/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            artifacts/demo/
            dist/

  neural:
    if: github.event_name == 'workflow_dispatch' && inputs.run_neural
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the CPU neural dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,neural]'
      - name: Train and evaluate the public cohort
        run: python -m benchmarks.run --backend setfit --allow-download --output artifacts/neural
      - name: Examine the neural artifact
        env:
          TINYTASK_NEURAL_MODEL: artifacts/neural/model
        run: pytest tests/test_neural.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-evidence
          path: |
            artifacts/neural/summary.json
            artifacts/neural/evaluation.json
