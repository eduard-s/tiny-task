[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiny-task-py"
version = "0.1.0"
description = "Train local text classifiers and measure which requests they can accept"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Eduard Smirnov"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
neural = ["setfit>=1.2,<2", "sentence-transformers>=5.7,<6", "transformers>=4.57.6,<5", "torch>=2.6"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.14,<1", "mypy>=1.15,<2", "build>=1,<2", "twine>=6,<7"]

[project.scripts]
tiny-task = "tiny_task.cli:main"

[project.urls]
Homepage = "https://github.com/eduard-s/tiny-task"
Repository = "https://github.com/eduard-s/tiny-task"
Issues = "https://github.com/eduard-s/tiny-task/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_task"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/docs", "/examples", "/scripts/*.py", "/benchmarks/*.py", "/benchmarks/*.json", "/benchmarks/*.md", "/benchmarks/*.txt", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/PUBLISHING.md", "/THIRD_PARTY.md", "/pyproject.toml"]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/.venv*/**", "**/artifacts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
